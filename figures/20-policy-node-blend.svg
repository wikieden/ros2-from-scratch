<text x="16.0" y="330.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">示意：旧块按旧观测算，新块按新观测算，两者在切换时刻不相等。时间集成对重叠时段加权平均；RTC 推理时就把来不及改的几步固定成旧块的值。</text>
