<text x="16.0" y="350.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">示意数据：里程计每走一段累积一点误差；定位每隔一阵把 map → odom 修正一下。控制器用 odom 下的位姿（平滑），全局规划用 map 下的（准）。</text>
