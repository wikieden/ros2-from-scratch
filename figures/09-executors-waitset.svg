<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">spin() 的一圈：问等待集“谁有活”，再挨个执行回调</text>
<text x="16.0" y="290.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">消息不在客户端库里排队，而是留在中间件里，取的时候才拿出来，这样 QoS 的队列深度才生效。等待集只说“有没有”，不说“几条、谁先到”。</text>
<rect x="20.0" y="70.0" width="210.0" height="170.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4" opacity="1"/>
<text x="125.0" y="94.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">中间件（rmw）</text>
<rect x="36.0" y="108.0" width="178.0" height="30.0" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="125.0" y="128.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal">/image 队列：3 条</text>
<rect x="36.0" y="148.0" width="178.0" height="30.0" rx="4" fill="#fff" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<text x="125.0" y="168.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal">定时器到点</text>
<rect x="36.0" y="188.0" width="178.0" height="30.0" rx="4" fill="#fff" stroke="#16a34a" stroke-width="1.4" opacity="1"/>
<text x="125.0" y="208.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal">服务请求：1 个</text>
<rect x="300.0" y="70.0" width="160.0" height="60.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" opacity="1"/>
<text x="380.0" y="96.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="bold">① wait_for_work</text>
<text x="380.0" y="112.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">阻塞，等有活</text>
<rect x="300.0" y="180.0" width="160.0" height="60.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" opacity="1"/>
<text x="380.0" y="206.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="bold">② 就绪列表</text>
<text x="380.0" y="222.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">image · timer · srv</text>
<rect x="540.0" y="120.0" width="150.0" height="70.0" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="615.0" y="151.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="bold">③ 执行回调</text>
<text x="615.0" y="167.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">一次一个（单线程）</text>
<line x1="230.0" y1="100.0" x2="300.0" y2="100.0" stroke="#7c3aed" stroke-width="1.6"/>
<polygon points="300.0,100.0 292.1,104.2 292.1,95.8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="380.0" y1="130.0" x2="380.0" y2="180.0" stroke="#7c3aed" stroke-width="1.6"/>
<polygon points="380.0,180.0 375.8,172.1 384.2,172.1" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="460.0" y1="191.3" x2="540.0" y2="172.6" stroke="#7c3aed" stroke-width="1.6"/>
<polygon points="540.0,172.6 533.2,178.5 531.3,170.3" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<polyline points="690.0,155.0 740.0,155.0 740.0,54.0 380.0,54.0 380.0,70.0" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<polygon points="380.0,70.0 375.8,62.1 384.2,62.1" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="526.3" y="37.5" width="67.3" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="560.0" y="49.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#7c3aed" text-anchor="middle" font-weight="normal">④ 再来一圈</text>
<line x1="615.0" y1="190.0" x2="615.0" y2="250.0" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="615.0,250.0 610.8,242.1 619.2,242.1" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="615.0" y="266.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="normal">take：此时才从中间件取消息</text>
</svg>
