<rect x="581.0" y="104.0" width="68.0" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="615.0" y="116.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#16a34a" text-anchor="middle" font-weight="normal">succeed()</text>
<line x1="560.0" y1="167.0" x2="670.0" y2="162.0" stroke="#dc2626" stroke-width="1.6"/>
<polygon points="670.0,162.0 662.3,166.6 661.9,158.1" fill="#dc2626" stroke="#dc2626" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="587.7" y="148.0" width="54.7" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="615.0" y="160.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="normal">abort()</text>
<line x1="490.0" y1="190.0" x2="490.0" y2="250.0" stroke="#ea580c" stroke-width="1.6"/>
<polygon points="490.0,250.0 485.8,242.1 494.2,242.1" fill="#ea580c" stroke="#ea580c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="495.9" y="209.5" width="112.2" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="552.0" y="221.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="normal">cancel 请求被同意</text>
<line x1="560.0" y1="275.0" x2="670.0" y2="275.0" stroke="#ea580c" stroke-width="1.6"/>
