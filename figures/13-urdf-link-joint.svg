<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">URDF 是一棵树：连杆是节点，关节连接父子并规定怎么动</text>
<text x="16.0" y="380.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">每个 link 一个坐标系，和第 12 章的 tf 树一一对应。origin = 关节角为 0 时子相对父的变换；转了 θ 就再绕 axis 转 θ。</text>
