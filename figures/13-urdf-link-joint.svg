<text x="40.0" y="270.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="bold">joint 类型</text>
<text x="40.0" y="290.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#374151" text-anchor="start" font-weight="normal">continuous：轮子      fixed：相机支架</text>
<text x="40.0" y="308.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#374151" text-anchor="start" font-weight="normal">prismatic：升降柱    revolute：机械臂关节</text>
<text x="40.0" y="344.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">每个 link 三种描述：visual（显示）· collision（碰撞）· inertial（质量惯量）</text>
