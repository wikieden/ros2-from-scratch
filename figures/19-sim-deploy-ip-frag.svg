<text x="56.0" y="211.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">内核重组缓冲区：其余 43 片干等，ipfrag_time（默认 30 s）到期才扔</text>
<rect x="580.0" y="186.0" width="260.0" height="40.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" opacity="1"/>
<text x="710.0" y="211.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal">缓冲区满 → 新的分片也被丢</text>
<text x="40.0" y="258.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ea580c" text-anchor="start" font-weight="normal">Reliable 还要重传丢掉的数据，重传的又要再拆：网络越差，堆得越多。</text>
</svg>
