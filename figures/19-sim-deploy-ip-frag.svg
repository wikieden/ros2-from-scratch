<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">Wi-Fi 上发大消息：一个 UDP 包拆成很多 IP 分片，丢一片整包作废</text>
<text x="16.0" y="300.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Linux 默认等 30 s 才放弃重组，重组缓冲区默认 256 KB，满了连接就像“卡死”。对策：Best effort、调小 ipfrag_time、调大缓冲区、压缩。</text>
<text x="40.0" y="76.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">图像消息被拆成多个 UDP 包；一个 64 KB 的 UDP 包再拆成约 44 个 1500 字节的 IP 分片</text>
