<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">实时 ≠ 快，而是准时：每个周期都要在截止时间前做完</text>
<text x="16.0" y="330.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">示意：1 kHz 回路，每周期计算约 0.4 ms。普通内核偶尔被别的任务抢走，某一拍拖过截止时间；PREEMPT_RT + 锁内存 + 预分配后抖动很小。</text>
<text x="60.0" y="60.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="bold">普通 Linux：大多数准时，偶尔一拍很晚</text>
