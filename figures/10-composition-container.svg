<text x="16.0" y="310.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">组件 = 没有 main 的节点，编成动态库；component_container 是“插线板”。分开放好调试、互不连累；合起来省开销，还能零拷贝。</text>
