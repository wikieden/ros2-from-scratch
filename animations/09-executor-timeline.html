<body><main>
<h1>第 9 章 · 谁在哪个线程里跑你的回调</h1>
<p class="sub">配套讲义：<a href="../lessons/09-executors.html">第 9 章 · Executor 与回调组：谁在什么时候、哪个线程里跑你的回调</a>。场景：一个节点有 50 Hz 控制定时器（每拍 20 ms）和一个很慢的图像回调（40 ms）。依据 About-Executors 与 Using-callback-groups。</p>
<div class="panel"><svg id="sv"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 重来</button></div>
<p class="note">看点：多线程 executor 不分组时，默认组是互斥组，回调仍一个一个跑；把控制和图像放进不同回调组，控制才能准时；同步等待的回调和"被等的回复"放不同组，死锁才解开。</p>
</main>
<script src="anim.js"></script><script src="stepper.js"></script>
<script>
STEPPER({h:350,

  I1:[130,20,240,36,'图像回调 40 ms','','amber'],C1:[375,20,60,36,'控制','','accent'],C1b:[440,20,60,36,'控制','','accent'],M1:[505,20,155,36,'控制漏了一拍','','bad'],
  L2:[20,70,100,36,'多线程·不分组','','muted'],

  L3:[20,120,100,70,'多线程·分组','两个线程','muted'],
  I3:[130,120,240,32,'线程 1：图像（组 B）','','amber'],

  L4:[20,212,100,36,'死锁','单线程','muted'],

  T5:[130,264,240,32,'线程 1：定时器（组 1）等着','','accent'],

  {n:'单线程',on:['L1','I1','C1','C1b','M1'],c:['① rclpy.spin(node) = 单线程 executor：一次只跑一个回调。','图像回调跑 40 ms 时，控制定时器到点了也只能等，控制回路漏拍、抖动。','']},
  {n:'不分组',on:['L2','I2','C2','M2'],c:['② 换成 MultiThreadedExecutor(num_threads=4)，但没建回调组。','所有回调都在节点的默认组里，默认组是互斥组：组内不能并行。结果还是一个一个跑。','这是最常见的误解：多线程 ≠ 并行，并行要靠回调组。']},
  {n:'分组',on:['L3','I3','C3a','C3b','C3c','C3d','G3'],c:['③ 控制定时器放互斥组 A，图像订阅放组 B。不同组的回调总能并行。','线程 1 慢慢处理图像，线程 2 每 20 ms 准时跑控制。','C++ 还能把组 A 交给单独的 executor + 高优先级线程（add_callback_group）。']},
  {n:'死锁',on:['L4','T4','R4','w4'],c:['④ 第 5 章的死锁：单线程里，定时器回调同步 call() 等服务回复。','回复到了，但唯一的线程正卡在定时器回调里，没人去处理回复。互相等待。','']},

  {n:'总结',all:true,c:['默认组是互斥组；不同组总能并行；可重入组连同一个回调都能并行。','慢回调和快回调分组分线程；同步等待的一方和被等的回复分组。Python 有 GIL，多线程主要解决等待，不加速计算。','']},
