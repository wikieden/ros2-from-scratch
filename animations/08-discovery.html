  {c:['节点靠"发现"自动找到彼此，没有中心 master。怎么发现，取决于中间件。','上半部分：DDS（默认 Fast DDS）；下半部分：Zenoh。','']},
  {n:'组播',on:['A1','A2','B1','MC','m1','m2','m3'],c:['① DDS：每个节点往局域网组播"我是谁、发收什么"，同一域里的人都听得到。','零配置、开箱即用。节点多了以后，这种"喊"的流量会很大。','']},
