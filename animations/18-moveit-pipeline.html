<h1>第 18 章 · MoveIt 2：从"手去那儿"到一条轨迹</h1>
<p class="sub">配套讲义：<a href="../lessons/18-moveit2.html">第 18 章 · MoveIt 2：机械臂运动规划</a>。依据 moveit2_tutorials 的 concepts（move_group、motion_planning、trajectory_processing）。</p>

<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 重来</button></div>
<p class="note">看点：move_group 自己不发 /joint_states、不提供执行用的动作服务器；规划器只给路径，时间参数化之后才是轨迹；执行交给第 16 章的关节轨迹控制器。</p>

<script>
STEPPER({h:340,

  MG:[220,40,240,70,'move_group','集成者：动作 / 服务','purple'],

  AD:[410,170,110,46,'④ 适配器','修起点等','accent'],
  TP:[530,170,130,46,'⑤ 时间参数化','TOTG','accent'],

 },
 arrows:{

  a1:[140,193,148,193,'','accent'],a2:[260,193,268,193,'','accent'],a3:[400,193,408,193,'','accent'],a4:[520,193,528,193,'','accent'],

  {c:['move_group 把各组件集成起来，对外提供规划和执行的动作 / 服务。','规划流水线：请求 → 逆解 → 规划器 → 适配器 → 时间参数化 → 交给控制器执行。','']},
  {n:'配置',on:['U','S','Y','u','s','y','MG'],c:['① 三份配置：URDF（长什么样）、SRDF（规划组 arm 含哪些关节、预定义姿态、哪些连杆对不用查碰撞）、','YAML（关节限位、运动学求解器、规划器）。SRDF 和 YAML 用 MoveIt Setup Assistant 生成一次。','']},
  {n:'状态',on:['PS','ps','JS','js','MG'],c:['② move_group 读 /joint_states 和 tf 知道机器人现在什么姿势、在哪（它自己不发布，要机器人侧提供）。','规划场景 = 机器人当前状态 + 周围障碍物 + 手里拿着的东西（当成刚性连在手上）。','']},
